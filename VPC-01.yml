AWSTemplateFormatVersion: '2010-09-09'
Description: vpc setup bySundhar

Parameters:

  Environment:
    Type: String
    AllowedValues:
      - Dev
      - Prod

  VpcName:
    Type: String

  VpcCIDR:
    Type: String

  publicSubnet1CIDR:
    Type: String
  publicSubnet2CIDR:
    Type: String
  publicSubnet3CIDR:
    Type: String

  privateSubnet1CIDR:
    Type: String
  privateSubnet2CIDR:
    Type: String
  privateSubnet3CIDR:
    Type: String

Mappings:

  AZMap:
    AZ1:
      Index: 0
    AZ2:
      Index: 1
    AZ3:
      Index: 2

Conditions:
  IsProd: !Equals
    - !Ref Environment
    - Prod

Resources:
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-${Environment}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-IGW-${Environment}

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref InternetGateway

  publicsubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: !Ref publicSubnet1CIDR
      AvailabilityZone: !Select
        - !FindInMap
          - AZMap
          - AZ1
          - Index
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-PublicSubnet1-${Environment}

  publicsubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: !Ref publicSubnet2CIDR
      AvailabilityZone: !Select
        - !FindInMap
          - AZMap
          - AZ2
          - Index
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-PublicSubnet2-${Environment}

  publicsubnet3:
    Type: AWS::EC2::Subnet
    Condition: IsProd
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: !Ref publicSubnet3CIDR
      AvailabilityZone: !Select
        - !FindInMap
          - AZMap
          - AZ3
          - Index
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-PublicSubnet3-${Environment}

  privatesubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: !Ref privateSubnet1CIDR
      AvailabilityZone: !Select
        - !FindInMap
          - AZMap
          - AZ1
          - Index
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-PrivateSubnet1-${Environment}

  privatesubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: !Ref privateSubnet2CIDR
      AvailabilityZone: !Select
        - !FindInMap
          - AZMap
          - AZ2
          - Index
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-PrivateSubnet2-${Environment}

  privatesubnet3:
    Type: AWS::EC2::Subnet
    Condition: IsProd
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: !Ref privateSubnet3CIDR
      AvailabilityZone: !Select
        - !FindInMap
          - AZMap
          - AZ3
          - Index
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-PrivateSubnet3-${Environment}

  publicrouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-PublicRouteTable-${Environment}

  privateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-PrivateRouteTable-${Environment}

  publicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref publicrouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  publicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref publicsubnet1
      RouteTableId: !Ref publicrouteTable

  publicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref publicsubnet2
      RouteTableId: !Ref publicrouteTable

  publicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsProd
    Properties:
      SubnetId: !Ref publicsubnet3
      RouteTableId: !Ref publicrouteTable

  privateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref privatesubnet1
      RouteTableId: !Ref privateRouteTable

  privateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref privatesubnet2
      RouteTableId: !Ref privateRouteTable

  privateSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsProd
    Properties:
      SubnetId: !Ref privatesubnet3
      RouteTableId: !Ref privateRouteTable